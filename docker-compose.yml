services:
  mysql:
    image: mysql
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: tp_nest
      MYSQL_USER: nest_user
      MYSQL_PASSWORD: nest_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nest_network

  adminer:
    image: adminer
    container_name: adminer
    environment:
      ADMINER_DEFAULT_SERVER: mysql_db
    ports:
      - "8080:8080"
    networks:
      - nest_network

networks:
  nest_network:

volumes:
  mysql_data:
